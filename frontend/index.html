<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', (event) => {
        document.body.innerHTML += `<div style="background:red;color:white;padding:20px;position:fixed;top:0;left:0;width:100%;z-index:9999;font-family:monospace;"><h3>Runtime Error</h3><p>${event.error ? event.error.message : event.message}</p><pre>${event.error ? event.error.stack : ''}</pre></div>`;
      });
      window.addEventListener('unhandledrejection', (event) => {
        document.body.innerHTML += `<div style="background:red;color:white;padding:20px;position:fixed;top:0;left:0;width:100%;z-index:9999;font-family:monospace;"><h3>Unhandled Promise</h3><p>${event.reason ? event.reason.message || event.reason : 'Unknown reason'}</p><pre>${event.reason ? event.reason.stack : ''}</pre></div>`;
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
